<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Tesks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tela"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        var site = document.getElementById("tela");
        var root = ReactDOM.createRoot(tela);
        function BodyTesks(){
            const [numTarefas, setnumTarefas] = React.useState(3);
            return (
                <>
                    <div id="blocoAgenda">
                        <div id="cabeca">
                            <div id="contador">
                                <strong>
                                    {numTarefas}
                                </strong>
                            </div>
                            <div id="titulo">
                                <strong>
                                    TESKS OF THE DAY
                                </strong>
                            </div>
                            <div onClick={() =>{
                                setnumTarefas(numTarefas + 1);
                                abrirModal();
                            }} id="addTesk">
                                <strong>
                                    +
                                </strong>
                            </div>
                        </div>
                        <div id="listaTesks">
                            <NewTesk tarefa="Projeto de programação" expecificacao="Começar taréfa"/>
                            <NewTesk tarefa="Homework" expecificacao="Banco de dados"/>
                            <NewTesk tarefa="Comprar whey" expecificacao="Hoje as 9h"/>
                        </div>    
                    </div>
                    <div class="modal" id="modal">
                        <div class="modalTask">
                            <button onClick={() => {setnumTarefas(numTarefas - 1)}} class="fechar" id="fechar">X</button>
                            <div id="novaTarefa"><strong>Nova Taréfa</strong></div>
                            <div id="nomeTarefa">
                            <div>Taréfa<input></input></div><br></br>
                            <div>Descrição<input></input></div></div>
                        </div>
                    </div>
                </>
            )
        }
        function NewTesk(propt) {
            return (
                    <div id="estruturaTesk">
                        <h1>{propt.tarefa}</h1>
                        {propt.expecificacao && <h3>{propt.expecificacao}</h3>}
                    </div>
                    )
        }
        function abrirModal(){
                        const modal = document.getElementById('modal')
                        modal.classList.add('abrir')

                        modal.addEventListener('click', (e) => {
                            if(e.target.id == 'fechar' || e.target.id == 'modal'){
                            modal.classList.remove('abrir');
                            }
                        })
                    }
        function App(){
            return (
                <>
                    <BodyTesks />
                </>
            )
        }
        root.render(<App />);
    </script>
</body>
</html>
